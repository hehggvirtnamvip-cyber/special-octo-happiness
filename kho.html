<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KAIRO TOOL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background-color: #f2ead8;
  background-image: linear-gradient(#ded0b1 1px, transparent 1px);
  background-size: 100% 28px;
  color: #2a2118;
  font-family: 'Kalam', cursive;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }

/* ── HEADER ── */
.kho-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 28px;
  border-bottom: 2px dashed #c2b088;
  background: rgba(242,234,216,0.96);
  backdrop-filter: blur(6px);
  position: sticky; top: 0; z-index: 10;
}
.kho-header .logo {
  font-family: 'Caveat', cursive; font-size: 1.7rem; font-weight: 700;
  color: #b8281e; display: flex; align-items: center; gap: 8px;
  letter-spacing: 0.03em;
}
.btn-logout, .btn-back {
  background: #ffc4d4; border: 2px solid #2a2118; color: #2a2118;
  padding: 8px 18px; border-radius: 4px;
  font-family: 'Patrick Hand', cursive; font-size: 1rem; font-weight: 700;
  cursor: pointer; box-shadow: 3px 3px 0 #2a2118; transition: 0.1s;
  display: flex; align-items: center; gap: 6px;
}
.btn-logout:active, .btn-back:active { transform: translate(3px,3px); box-shadow: 0 0 0 #2a2118; }

/* ── KHO VIEW ── */
#viewKho { flex: 1; display: flex; flex-direction: column; }
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 28px;
  padding: 32px 24px;
  max-width: 1100px; margin: 0 auto; width: 100%;
}

/* ── GAME CARD ENHANCED ── */
.game-card {
  background: #fff3a8;
  border: 2.5px solid #2a2118;
  border-radius: 3px;
  padding: 28px 22px 22px;
  text-align: center;
  position: relative;
  cursor: pointer;
  box-shadow: 5px 5px 0 rgba(42,33,24,0.85);
  transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease;
  overflow: visible;
}
.game-card:nth-child(even) { background: #b8dcff; }
.game-card:nth-child(3n)   { background: #c8eab0; }

/* Pin */
.game-card::before {
  content: '📌';
  position: absolute; top: -14px; left: 50%;
  transform: translateX(-50%);
  font-size: 1.6rem;
  filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25));
  transition: transform 0.2s;
}
.game-card:hover::before { transform: translateX(-50%) rotate(-15deg) scale(1.15); }

/* Tape strip decoration */
.game-card::after {
  content: '';
  position: absolute; bottom: -3px; right: 12px;
  width: 40px; height: 7px;
  background: rgba(184,40,30,0.18);
  border-radius: 2px;
  transform: rotate(-2deg);
}

.game-card:hover {
  transform: translate(-3px,-4px) rotate(-0.5deg);
  box-shadow: 8px 9px 0 rgba(42,33,24,0.85);
}
.game-card:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(42,33,24,0.85);
}

/* NEW badge (game mới) */
.game-card .badge-new {
  position: absolute; top: -10px; right: -8px;
  background: #b8281e; color: #fff;
  font-family: 'Patrick Hand', cursive; font-size: 0.72rem;
  padding: 4px 10px; border-radius: 12px;
  border: 2px solid #2a2118;
  box-shadow: 2px 2px 0 rgba(42,33,24,0.5);
  letter-spacing: 0.06em; font-weight: 700;
  transform: rotate(6deg);
  z-index: 2;
}
.game-card .badge-pro {
  background: #1e4a8c;
}

/* Animated logo circle */
.game-logo {
  width: 72px; height: 72px;
  margin: 0 auto 18px;
  background: #fff;
  border: 2.5px solid #2a2118;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 2rem; color: #b8281e;
  box-shadow: 3px 3px 0 rgba(42,33,24,0.45);
  position: relative;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
}
.game-card:hover .game-logo { transform: scale(1.12) rotate(6deg); }

/* Pulse ring on logo */
.game-logo::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px dashed rgba(184,40,30,0.4);
  animation: logo-spin 8s linear infinite;
}
@keyframes logo-spin { to { transform: rotate(360deg); } }

.game-name  { font-family:'Caveat',cursive; font-size:1.9rem; font-weight:700; margin-bottom:4px; color:#2a2118; }
.game-tagline { font-family:'Kalam',cursive; font-size:0.88rem; color:#6e5c44; margin-bottom:22px; }

.btn-play {
  width: 100%; padding: 11px 0;
  border-radius: 4px; border: 2px solid #2a2118;
  background: #b8281e; color: #fff;
  font-family: 'Patrick Hand', cursive; font-weight: 700; font-size: 1.1rem;
  cursor: pointer; box-shadow: 3px 3px 0 #2a2118; transition: 0.1s;
  letter-spacing: 0.04em;
  position: relative; overflow: hidden;
}
.btn-play::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
  transform: translateX(-100%);
  transition: transform 0.5s ease;
}
.btn-play:hover::after { transform: translateX(100%); }
.btn-play:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2118; }

/* ── TOOL VIEW ── */
#viewTool { display: none; flex: 1; flex-direction: column; min-height: 100vh; }

.tool-header {
  padding: 14px 20px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(242,234,216,0.96);
  border-bottom: 2px dashed #c2b088;
}
.tool-header .title {
  font-family: 'Caveat', cursive; font-size: 1.7rem; font-weight: 700; color: #b8281e;
}

.tool-main {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px; overflow-y: auto; gap: 24px;
}

/* ── CIRCLE WRAP – ENHANCED ── */
.circle-wrap {
  position: relative;
  width: 270px; height: 270px;
  display: grid; place-items: center;
  flex-shrink: 0;
}

.circle-wrap::before {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 50%;
  background: conic-gradient(
    rgba(184,40,30,0.08) 0deg,
    rgba(30,74,140,0.08) 180deg,
    rgba(184,40,30,0.08) 360deg
  );
  animation: hue-shift 6s linear infinite;
}
@keyframes hue-shift { to { transform: rotate(360deg); } }

.circle-wrap::after {
  content: '';
  position: absolute; inset: 2px;
  border-radius: 50%;
  border: 1.5px dashed rgba(42,33,24,0.12);
  pointer-events: none;
}

.circle-svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  filter: drop-shadow(0 4px 16px rgba(184,40,30,0.25));
  position: relative; z-index: 1;
}
.circle-svg circle { fill: none; stroke-linecap: round; }
.circle-svg .bg    { stroke: rgba(42,33,24,0.1); stroke-width: 10; }
.circle-svg .track {
  stroke: rgba(42,33,24,0.04);
  stroke-width: 20;
}
.circle-svg .progress {
  stroke: url(#grad);
  stroke-width: 12;
  stroke-dasharray: 785;
  stroke-dashoffset: 785;
  transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
}
.circle-svg .progress-glow {
  stroke: url(#gradGlow);
  stroke-width: 20;
  stroke-dasharray: 785;
  stroke-dashoffset: 785;
  opacity: 0.25;
  transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
  filter: blur(4px);
}

.circle-text {
  position: absolute; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: calc(100% - 40px); height: calc(100% - 40px);
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.85), rgba(242,234,216,0.75));
  border-radius: 50%;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.06), 0 0 0 1.5px rgba(42,33,24,0.08);
  backdrop-filter: blur(4px);
}

.pred-text {
  font-family: 'Caveat', cursive;
  font-size: 4.8rem; font-weight: 700;
  color: #b8281e; line-height: 1;
  text-shadow: 2px 2px 0 rgba(184,40,30,0.15);
  transition: color 0.4s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1);
}
.pred-text.tai { color: #1e4a8c; text-shadow: 2px 2px 0 rgba(30,74,140,0.15); }
.pred-text.pop { animation: pred-pop 0.45s cubic-bezier(.34,1.56,.64,1); }
@keyframes pred-pop { 0%{transform:scale(0.6);opacity:0;} 100%{transform:scale(1);opacity:1;} }

.rate-text {
  font-size: 1.15rem; color: #453728; margin-top: 6px;
  font-weight: 700; font-family: 'Kalam', cursive;
  letter-spacing: 0.05em;
}

.conf-label {
  position: absolute; bottom: 14px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Patrick Hand', cursive;
  font-size: 0.72rem; color: #6e5c44;
  letter-spacing: 0.08em; text-transform: uppercase;
  white-space: nowrap;
}

@keyframes spin-full { to { transform: rotate(360deg); } }

.circle-wrap.spinning .circle-svg {
  animation: spin-full 1.4s cubic-bezier(.4,0,.6,1) infinite;
}
.circle-wrap.spinning .circle-text {
  background: radial-gradient(circle, rgba(255,255,255,0.7), rgba(242,234,216,0.5));
}

.analyze-dots::after {
  content: '';
  animation: dots 1.4s steps(4, end) infinite;
}
@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

/* ── HISTORY PANEL ENHANCED ── */
.history-panel {
  width: 100%; max-width: 600px;
  background: #fffdf5;
  border: 2.5px solid #2a2118;
  border-radius: 6px;
  padding: 18px 20px;
  box-shadow: 5px 5px 0 rgba(42,33,24,0.8);
  flex: 1; display: flex; flex-direction: column; min-height: 240px;
}
.history-panel h3 {
  font-family: 'Caveat', cursive; font-size: 1.4rem; font-weight: 700;
  color: #1e4a8c;
  border-bottom: 2px solid #1e4a8c;
  padding-bottom: 6px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.history-table-wrap { flex: 1; overflow-y: auto; padding-right: 4px; }
.history-table { width: 100%; border-collapse: collapse; font-size: 1rem; font-family: 'Kalam', cursive; }
.history-table th {
  text-align: left; padding: 7px 10px; color: #6e5c44; font-weight: 700;
  position: sticky; top: 0; background: #fffdf5; z-index: 2;
}
.history-table td { padding: 9px 10px; border-bottom: 1px dashed #ded0b1; vertical-align: middle; }

.history-table tbody tr {
  animation: row-in 0.3s ease both;
}
@keyframes row-in {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.badge {
  padding: 3px 10px; border-radius: 4px; font-weight: 700;
  font-size: 0.9rem; display: inline-block; border: 1.5px solid transparent;
  letter-spacing: 0.03em;
}
.badge.x { background: rgba(184,40,30,0.1); color: #b8281e; border-color: #b8281e; }
.badge.t { background: rgba(30,74,140,0.1);  color: #1e4a8c;  border-color: #1e4a8c; }
.badge.wait { background: rgba(110,92,68,0.1); color:#6e5c44; border-color:#6e5c44; }

.result-win  { color: #2e7a2e; font-weight: bold; font-family: 'Patrick Hand', cursive; font-size: 1.1rem; }
.result-lose { color: #b8281e; font-weight: bold; font-family: 'Patrick Hand', cursive; font-size: 1.1rem; }
.result-wait { color: #6e5c44; font-family: 'Patrick Hand', cursive; }

.result-win::before  { content: '✓ '; }
.result-lose::before { content: '✗ '; }

.history-table-wrap::-webkit-scrollbar { width: 7px; }
.history-table-wrap::-webkit-scrollbar-track { background: #f2ead8; border-radius: 4px; }
.history-table-wrap::-webkit-scrollbar-thumb { background: #c2b088; border-radius: 4px; border: 2px solid #f2ead8; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #0c111c;
  border: 1px solid rgba(120,180,255,.35);
  color: #e8eefc;
  padding: 13px 24px;
  border-radius: 60px; font-weight: 500; font-size: .88rem;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 20px 50px -10px rgba(0,0,0,.7);
  opacity: 0; transition: .45s cubic-bezier(.34,1.56,.64,1);
  z-index: 999; pointer-events: none; max-width: 90vw;
  font-family: 'Patrick Hand', cursive;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast i { font-size: 1.1rem; color: #22c55e; }

/* ── DEVTOOLS WARNING OVERLAY ── */
#devWarn {
  display: none; position: fixed; inset: 0;
  background: rgba(12,17,28,0.97); color: #e8eefc;
  z-index: 99999; padding: 40px 24px;
  font-family: 'Patrick Hand', cursive; text-align: center;
  align-items: center; justify-content: center; flex-direction: column; gap: 20px;
}
#devWarn.show { display: flex; }
#devWarn h2 { font-size: 2rem; color: #ef4444; }
#devWarn p { font-size: 1.1rem; max-width: 480px; line-height: 1.6; }
#devWarn button {
  margin-top: 16px; padding: 12px 28px;
  background: #22c55e; border: 2px solid #fff; color: #0c111c;
  border-radius: 6px; font-family: 'Patrick Hand', cursive;
  font-size: 1rem; font-weight: 700; cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .game-card, .game-logo, .circle-wrap::before,
  .circle-wrap.spinning .circle-svg,
  .history-table tbody tr { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- DevTools warning overlay -->
<div id="devWarn">
  <h2>⚠️ PHÁT HIỆN CAN THIỆP</h2>
  <p>Bạn đang cố gắng mở DevTools hoặc chỉnh sửa mã nguồn.<br>Vui lòng đóng DevTools và tải lại trang để tiếp tục sử dụng.</p>
  <button onclick="location.reload()">Tải lại trang</button>
</div>

<div id="viewKho">
  <div class="kho-header">
    <div class="logo">🦁 KAIRO TOOL</div>
    <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
  </div>
  <div class="game-grid" id="gameGrid"></div>
</div>

<div id="viewTool">
  <div class="tool-header">
    <button class="btn-back" onclick="backToKho()"><i class="fas fa-arrow-left"></i> Trở về</button>
    <div class="title" id="toolTitle">GAME</div>
    <div style="width:80px;"></div>
  </div>

  <div class="tool-main">
    <div class="circle-wrap" id="circleWrap">
      <svg class="circle-svg" id="toolCircleSvg" viewBox="0 0 260 260">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#b8281e"/>
            <stop offset="50%"  stop-color="#8e3dab"/>
            <stop offset="100%" stop-color="#1e4a8c"/>
          </linearGradient>
          <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#ff5c52"/>
            <stop offset="100%" stop-color="#5b8fff"/>
          </linearGradient>
        </defs>
        <circle class="track"    cx="130" cy="130" r="120"></circle>
        <circle class="bg"       cx="130" cy="130" r="120"></circle>
        <circle class="progress-glow" id="toolCircleGlow" cx="130" cy="130" r="120"></circle>
        <circle class="progress" id="toolCircle"    cx="130" cy="130" r="120"></circle>
      </svg>
      <div class="circle-text">
        <div class="pred-text" id="toolPredText">--</div>
        <div class="rate-text" id="toolRateText">--%</div>
      </div>
      <div class="conf-label" id="confLabel">ĐỘ TIN CẬY</div>
    </div>

    <div class="history-panel">
      <h3><i class="fas fa-history"></i> Lịch sử &amp; Dự đoán</h3>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead>
            <tr>
              <th>Phiên</th><th>Dự đoán</th><th>Kết quả</th><th>Đánh giá</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-circle-check"></i><span id="toastText"></span></div>

<script>
// ═══════════════════════════════════════════════════════════
// 🔒 ANTI-CRACK LAYER — Bắt đầu
// ═══════════════════════════════════════════════════════════
(function antiCrack() {
  'use strict';

  // 1) Chặn context menu (chuột phải)
  document.addEventListener('contextmenu', e => e.preventDefault(), false);

  // 2) Chặn các phím tắt DevTools / View Source / Save / Copy
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    // F12
    if (e.key === 'F12') { e.preventDefault(); return false; }
    // Ctrl/Cmd + Shift + I/J/C/K/E
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c','k','e'].includes(k)) {
      e.preventDefault(); return false;
    }
    // Ctrl/Cmd + U (view source)
    if ((e.ctrlKey || e.metaKey) && k === 'u') { e.preventDefault(); return false; }
    // Ctrl/Cmd + S (save)
    if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); return false; }
    // Ctrl/Cmd + P (print → có thể dump source)
    if ((e.ctrlKey || e.metaKey) && k === 'p') { e.preventDefault(); return false; }
    // Ctrl/Cmd + A (select all) — chỉ chặn khi không ở input
    if ((e.ctrlKey || e.metaKey) && k === 'a') {
      const t = e.target;
      if (!/INPUT|TEXTAREA/.test(t.tagName)) e.preventDefault();
    }
  }, false);

  // 3) Phát hiện DevTools qua kích thước cửa sổ (window.outerWidth - innerWidth)
  let devtoolsOpen = false;
  const THRESHOLD = 160;
  function checkDevtools() {
    const wDiff = window.outerWidth - window.innerWidth;
    const hDiff = window.outerHeight - window.innerHeight;
    // Kiểm tra nếu bị docked (thường > 160px)
    if (wDiff > THRESHOLD || hDiff > THRESHOLD) {
      if (!devtoolsOpen) {
        devtoolsOpen = true;
        const warn = document.getElementById('devWarn');
        if (warn) warn.classList.add('show');
        document.body.style.overflow = 'hidden';
        clearInterval(window.__predTimer__);
      }
    } else {
      if (devtoolsOpen) {
        devtoolsOpen = false;
        const warn = document.getElementById('devWarn');
        if (warn) warn.classList.remove('show');
        document.body.style.overflow = '';
      }
    }
  }
  setInterval(checkDevtools, 800);

  // 4) Override console.log/warn/error → xóa dấu vết, ngăn debug
  // (nhưng vẫn giữ lỗi thật để tự debug — comment dòng dưới nếu cần)
  try {
    const noop = function() {};
    // window.console.log = noop;   // Bật nếu muốn ẩn hoàn toàn
    // window.console.warn = noop;
    // window.console.error = noop;
  } catch (e) {}

  // 5) Bẫy `debugger` — tự động pause nếu ai đó cố step-through
  // Chỉ chạy định kỳ nhẹ, không spam
  setInterval(() => {
    try {
      (function() {
        // Nếu có ai gắn breakpoint / debugger statement → sẽ bị kéo vào
        // Đây chỉ là trick, không thật sự chặn 100%
      })();
    } catch (e) {}
  }, 5000);

  // 6) Kiểm tra DOM integrity — nếu ai đó xóa #viewKho/#viewTool qua DevTools
  setInterval(() => {
    if (!document.getElementById('viewKho') || !document.getElementById('viewTool')) {
      location.reload();
    }
  }, 3000);

  // 7) Chống copy nội dung text (chỉ chặn khi không phải input)
  document.addEventListener('copy', e => {
    const t = e.target;
    if (!/INPUT|TEXTAREA/.test(t.tagName)) {
      e.preventDefault();
    }
  });

  // 8) Detect hàm fetch bị override (ai đó hook để chặn request)
  const nativeFetch = window.fetch;
  Object.defineProperty(window, 'fetch', {
    get() { return nativeFetch; },
    set() { /* chặn ghi đè */ }
  });

  // 9) Detect XMLHttpRequest bị override (chặn hook ajax)
  const NativeXHR = window.XMLHttpRequest;
  Object.defineProperty(window, 'XMLHttpRequest', {
    get() { return NativeXHR; },
    set() { /* chặn */ }
  });

  // 10) Chặn window.location thay đổi bất thường (chống redirect độc hại)
  //     — giữ nguyên location để app hoạt động bình thường, chỉ chặn eval
  window.eval = function() { throw new Error('eval disabled'); };
  window.Function = function() { throw new Error('Function disabled'); };
})();
// ═══════════════════════════════════════════════════════════
// 🔒 ANTI-CRACK LAYER — Kết thúc
// ═══════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);

function toast(msg, type='ok') {
  const t = $('toast'); $('toastText').textContent = msg;
  const ic = t.querySelector('i');
  ic.className = type==='ok' ? 'fas fa-circle-check' : 'fas fa-circle-exclamation';
  ic.style.color = type==='ok' ? '#22c55e' : '#ef4444';
  t.classList.add('show'); clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3200);
}

document.body.style.display = 'none';

function forceLogout() {
  localStorage.removeItem('kairo_key');
  window.location.href = '/';
}

async function authFetch(url, opts = {}) {
  const key = localStorage.getItem('kairo_key');
  if (!key) { forceLogout(); throw new Error('NO_KEY'); }
  const headers = Object.assign({}, opts.headers, { 'x-kairo-key': key });
  const r = await fetch(url, Object.assign({}, opts, { headers }));
  if (r.status === 401) { forceLogout(); throw new Error('UNAUTHORIZED'); }
  return r;
}

let CONFIG_GAMES = [];
let currentToken = null;
let predTimer    = null;
let isSpinning   = false;
let lastPhien    = null;
let retryCount   = 0;
const REFRESH_MS = 6000;

// Lưu timer toàn cục để antiCrack có thể kill
Object.defineProperty(window, '__predTimer__', {
  get: () => predTimer,
  set: v => { predTimer = v; }
});

function logout() {
  localStorage.removeItem('kairo_key');
  window.location.href = '/index.html';
}

async function loadGames() {
  try {
    const r = await authFetch('/api/games');
    CONFIG_GAMES = (await r.json()).games;
    renderGames();
  } catch(e) { toast('Lỗi tải danh sách game', 'err'); }
}

function renderGames() {
  const grid = $('gameGrid');
  grid.innerHTML = '';
  CONFIG_GAMES.forEach(g => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.onclick = () => openTool(g.token, g.name);

    // Badge NEW/PRO
    let badgeHtml = '';
    if (g.badge === 'NEW') {
      badgeHtml = '<div class="badge-new">NEW</div>';
    } else if (g.badge === 'PRO') {
      badgeHtml = '<div class="badge-new badge-pro">PRO</div>';
    }

    card.innerHTML = `
      ${badgeHtml}
      <div class="game-logo"><i class="fas ${g.icon}"></i></div>
      <div class="game-name">${g.name}</div>
      <div class="game-tagline">${g.tagline}</div>
      <button class="btn-play"><i class="fas fa-play"></i> BẮT ĐẦU</button>
    `;
    grid.appendChild(card);
  });
}

function backToKho() {
  clearInterval(predTimer);
  predTimer = null;
  retryCount = 0;
  $('viewTool').style.display = 'none';
  $('viewKho').style.display  = 'flex';
}

function openTool(token, name) {
  currentToken = token;
  lastPhien = null; isSpinning = false; retryCount = 0;

  $('toolTitle').textContent = name;
  $('toolPredText').textContent = '--';
  $('toolPredText').className   = 'pred-text';
  $('toolPredText').style.color = '';
  $('toolPredText').style.fontSize = '';
  $('toolRateText').textContent = '--%';
  $('toolRateText').style.color = '';
  $('toolCircle').style.strokeDashoffset = 785;
  $('toolCircleGlow').style.strokeDashoffset = 785;
  $('toolCircleSvg').style.transform = 'rotate(-90deg)';
  $('circleWrap').classList.remove('spinning');
  $('historyBody').innerHTML = '';

  $('viewKho').style.display  = 'none';
  $('viewTool').style.display = 'flex';
  startPrediction();
}

function startPrediction() {
  clearInterval(predTimer);
  fetchPrediction(true);
  predTimer = setInterval(() => fetchPrediction(false), REFRESH_MS);
}

async function fetchPrediction(isFirst) {
  if (isSpinning) return;
  try {
    const r = await authFetch('/api/predict/' + encodeURIComponent(currentToken) + '?v=' + Date.now());
    let d;
    try { d = await r.json(); } catch(err) { throw new Error('SERVER_DISCONNECTED'); }
    if (d.error) throw new Error(d.error);
    retryCount = 0;

    if (lastPhien !== null && d.phien !== lastPhien) {
      isSpinning = true;
      startSpin();
      setTimeout(() => { isSpinning = false; renderTool(d); }, 10000);
    } else {
      renderTool(d);
    }
    lastPhien = d.phien;
  } catch(e) {
    console.log('Lỗi API:', e.message);
    if (retryCount < 5) {
      retryCount++;
      $('toolPredText').textContent  = 'ĐANG KẾT NỐI';
      $('toolPredText').className    = 'pred-text analyze-dots';
      $('toolPredText').style.fontSize = '1.4rem';
      try {
        const rg = await authFetch('/api/games');
        const dataG = await rg.json();
        if (dataG.games && dataG.games.length > 0) {
          const cfg = dataG.games.find(g => g.name === $('toolTitle').textContent);
          if (cfg) currentToken = cfg.token;
        }
      } catch(errG) {}
      setTimeout(() => fetchPrediction(false), 5000);
      return;
    }
    $('toolPredText').textContent = 'LỖI';
    $('toolRateText').textContent = 'SERVER OFFLINE';
    $('toolPredText').className   = 'pred-text';
    $('toolPredText').style.color = '#b8281e';
    $('toolPredText').style.fontSize = '2rem';
    $('toolRateText').style.color = '#b8281e';
    $('circleWrap').classList.remove('spinning');
    toast(e.message, 'err');
    clearInterval(predTimer);
  }
}

function startSpin() {
  const wrap     = $('circleWrap');
  const predText = $('toolPredText');
  const rateText = $('toolRateText');

  wrap.classList.add('spinning');
  $('toolCircleSvg').style.transform = 'rotate(-90deg)';
  $('toolCircle').style.strokeDashoffset = 785;
  $('toolCircleGlow').style.strokeDashoffset = 785;

  predText.textContent = 'PHÂN TÍCH';
  predText.className   = 'pred-text analyze-dots';
  predText.style.fontSize = '1.6rem';
  predText.style.color = '';
  rateText.textContent = 'Đang tính toán…';
}

function renderTool(d) {
  const predText = $('toolPredText');
  const rateText = $('toolRateText');
  const circle   = $('toolCircle');
  const glow     = $('toolCircleGlow');
  const wrap     = $('circleWrap');

  let pred = d.du_doan || '--';
  let conf = d.tin_cay || 0;

  wrap.classList.remove('spinning');
  $('toolCircleSvg').style.transform = 'rotate(-90deg)';

  predText.style.color    = '';
  predText.style.fontSize = '';

  circle.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)';
  glow.style.transition   = 'stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)';

  predText.textContent = pred;
  predText.className   = 'pred-text pop ' + (pred === 'TÀI' || pred === 'BIG' ? 'tai' : '');
  rateText.textContent = conf + '%';

  const offset = 785 - (785 * Math.min(conf, 100) / 100);
  circle.style.strokeDashoffset = offset;
  glow.style.strokeDashoffset   = offset;

  if (d.history && Array.isArray(d.history)) {
    const historyBody = $('historyBody');
    historyBody.innerHTML = '';
    d.history.forEach(item => {
      const tr = document.createElement('tr');
      const badgeCls = (item.du_doan === 'TÀI' || item.du_doan === 'BIG') ? 'badge t' : 'badge x';
      let resultHtml = `<span class="result-wait">...</span>`;
      let evalHtml   = `<span class="result-wait">...</span>`;
      if (item.ket_qua) {
        const actualCls = (item.ket_qua === 'TÀI' || item.ket_qua === 'BIG') ? 'badge t' : 'badge x';
        resultHtml = `<span class="${actualCls}">${item.ket_qua}</span>`;
        evalHtml   = item.danh_gia === 'WIN'
          ? `<span class="result-win">WIN</span>`
          : `<span class="result-lose">LOSE</span>`;
      }
      tr.innerHTML = `
        <td>#${item.phien}</td>
        <td><span class="${badgeCls}">${item.du_doan}</span></td>
        <td>${resultHtml}</td>
        <td>${evalHtml}</td>
      `;
      historyBody.appendChild(tr);
    });
  }
}

window.addEventListener('load', async () => {
  const key = localStorage.getItem('kairo_key');
  if (!key) return forceLogout();
  try {
    const r = await fetch('/api/key/verify', { headers: { 'x-kairo-key': key } });
    if (!r.ok) return forceLogout();
    const d = await r.json();
    if (!d || !d.ok) return forceLogout();
    document.body.style.display = 'flex';
    loadGames();
  } catch(e) { forceLogout(); }
});
</script>
