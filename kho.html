<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KAIRO TOOL - Kho Game</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background-color: #f2ead8;
  background-image: linear-gradient(#ded0b1 1px, transparent 1px);
  background-size: 100% 28px;
  color: #2a2118;
  font-family: 'Kalam', cursive;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }

/* ── HEADER ── */
.kho-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 28px;
  border-bottom: 2px dashed #c2b088;
  background: rgba(242,234,216,0.96);
  backdrop-filter: blur(6px);
  position: sticky; top: 0; z-index: 10;
}
.kho-header .logo {
  font-family: 'Caveat', cursive; font-size: 1.7rem; font-weight: 700;
  color: #b8281e; display: flex; align-items: center; gap: 8px;
  letter-spacing: 0.03em;
}
.btn-logout, .btn-back {
  background: #ffc4d4; border: 2px solid #2a2118; color: #2a2118;
  padding: 8px 18px; border-radius: 4px;
  font-family: 'Patrick Hand', cursive; font-size: 1rem; font-weight: 700;
  cursor: pointer; box-shadow: 3px 3px 0 #2a2118; transition: 0.1s;
  display: flex; align-items: center; gap: 6px;
}
.btn-logout:active, .btn-back:active { transform: translate(3px,3px); box-shadow: 0 0 0 #2a2118; }

/* ── KHO VIEW ── */
#viewKho { flex: 1; display: flex; flex-direction: column; }
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 28px;
  padding: 32px 24px;
  max-width: 1100px; margin: 0 auto; width: 100%;
}

/* ── GAME CARD ── */
.game-card {
  background: #fff3a8;
  border: 2.5px solid #2a2118;
  border-radius: 3px;
  padding: 28px 22px 22px;
  text-align: center;
  position: relative;
  cursor: pointer;
  box-shadow: 5px 5px 0 rgba(42,33,24,0.85);
  transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s ease;
  overflow: visible;
}
.game-card:nth-child(even) { background: #b8dcff; }
.game-card:nth-child(3n)   { background: #c8eab0; }
.game-card::before {
  content: '📌';
  position: absolute; top: -14px; left: 50%;
  transform: translateX(-50%);
  font-size: 1.6rem;
  filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25));
  transition: transform 0.2s;
}
.game-card:hover::before { transform: translateX(-50%) rotate(-15deg) scale(1.15); }
.game-card::after {
  content: '';
  position: absolute; bottom: -3px; right: 12px;
  width: 40px; height: 7px;
  background: rgba(184,40,30,0.18);
  border-radius: 2px;
  transform: rotate(-2deg);
}
.game-card:hover {
  transform: translate(-3px,-4px) rotate(-0.5deg);
  box-shadow: 8px 9px 0 rgba(42,33,24,0.85);
}
.game-card:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(42,33,24,0.85);
}
.game-card .badge-new {
  position: absolute; top: -10px; right: -8px;
  background: #b8281e; color: #fff;
  font-family: 'Patrick Hand', cursive; font-size: 0.72rem;
  padding: 4px 10px; border-radius: 12px;
  border: 2px solid #2a2118;
  box-shadow: 2px 2px 0 rgba(42,33,24,0.5);
  letter-spacing: 0.06em; font-weight: 700;
  transform: rotate(6deg);
  z-index: 2;
}
.game-card .badge-pro { background: #1e4a8c; }
.game-logo {
  width: 72px; height: 72px;
  margin: 0 auto 18px;
  background: #fff;
  border: 2.5px solid #2a2118;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 2rem; color: #b8281e;
  box-shadow: 3px 3px 0 rgba(42,33,24,0.45);
  position: relative;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
}
.game-card:hover .game-logo { transform: scale(1.12) rotate(6deg); }
.game-logo::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px dashed rgba(184,40,30,0.4);
  animation: logo-spin 8s linear infinite;
}
@keyframes logo-spin { to { transform: rotate(360deg); } }
.game-name  { font-family:'Caveat',cursive; font-size:1.9rem; font-weight:700; margin-bottom:4px; color:#2a2118; }
.game-tagline { font-family:'Kalam',cursive; font-size:0.88rem; color:#6e5c44; margin-bottom:22px; }
.btn-play {
  width: 100%; padding: 11px 0;
  border-radius: 4px; border: 2px solid #2a2118;
  background: #b8281e; color: #fff;
  font-family: 'Patrick Hand', cursive; font-weight: 700; font-size: 1.1rem;
  cursor: pointer; box-shadow: 3px 3px 0 #2a2118; transition: 0.1s;
  letter-spacing: 0.04em;
  position: relative; overflow: hidden;
}
.btn-play::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
  transform: translateX(-100%);
  transition: transform 0.5s ease;
}
.btn-play:hover::after { transform: translateX(100%); }
.btn-play:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2118; }

/* ── TOOL VIEW (CIRCLE) ── */
#viewToolCircle { display: none; flex: 1; flex-direction: column; min-height: 100vh; }
.tool-header {
  padding: 14px 20px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(242,234,216,0.96);
  border-bottom: 2px dashed #c2b088;
}
.tool-header .title {
  font-family: 'Caveat', cursive; font-size: 1.7rem; font-weight: 700; color: #b8281e;
}
.tool-main {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px; overflow-y: auto; gap: 24px;
}
.circle-wrap {
  position: relative;
  width: 270px; height: 270px;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.circle-wrap::before {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 50%;
  background: conic-gradient(
    rgba(184,40,30,0.08) 0deg,
    rgba(30,74,140,0.08) 180deg,
    rgba(184,40,30,0.08) 360deg
  );
  animation: hue-shift 6s linear infinite;
}
@keyframes hue-shift { to { transform: rotate(360deg); } }
.circle-svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  filter: drop-shadow(0 4px 16px rgba(184,40,30,0.25));
  position: relative; z-index: 1;
}
.circle-svg circle { fill: none; stroke-linecap: round; }
.circle-svg .bg    { stroke: rgba(42,33,24,0.1); stroke-width: 10; }
.circle-svg .track { stroke: rgba(42,33,24,0.04); stroke-width: 20; }
.circle-svg .progress {
  stroke: url(#grad);
  stroke-width: 12;
  stroke-dasharray: 785;
  stroke-dashoffset: 785;
  transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
}
.circle-svg .progress-glow {
  stroke: url(#gradGlow);
  stroke-width: 20;
  stroke-dasharray: 785;
  stroke-dashoffset: 785;
  opacity: 0.25;
  transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
  filter: blur(4px);
}
.circle-text {
  position: absolute; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: calc(100% - 40px); height: calc(100% - 40px);
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.85), rgba(242,234,216,0.75));
  border-radius: 50%;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.06), 0 0 0 1.5px rgba(42,33,24,0.08);
  backdrop-filter: blur(4px);
}
.pred-text {
  font-family: 'Caveat', cursive;
  font-size: 4.8rem; font-weight: 700;
  color: #b8281e; line-height: 1;
  text-shadow: 2px 2px 0 rgba(184,40,30,0.15);
  transition: color 0.4s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1);
}
.pred-text.tai { color: #1e4a8c; text-shadow: 2px 2px 0 rgba(30,74,140,0.15); }
.pred-text.pop { animation: pred-pop 0.45s cubic-bezier(.34,1.56,.64,1); }
@keyframes pred-pop { 0%{transform:scale(0.6);opacity:0;} 100%{transform:scale(1);opacity:1;} }
.rate-text {
  font-size: 1.15rem; color: #453728; margin-top: 6px;
  font-weight: 700; font-family: 'Kalam', cursive;
  letter-spacing: 0.05em;
}
.conf-label {
  position: absolute; bottom: 14px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Patrick Hand', cursive;
  font-size: 0.72rem; color: #6e5c44;
  letter-spacing: 0.08em; text-transform: uppercase;
  white-space: nowrap;
}
@keyframes spin-full { to { transform: rotate(360deg); } }
.circle-wrap.spinning .circle-svg { animation: spin-full 1.4s cubic-bezier(.4,0,.6,1) infinite; }

/* ── HISTORY PANEL ── */
.history-panel {
  width: 100%; max-width: 600px;
  background: #fffdf5;
  border: 2.5px solid #2a2118;
  border-radius: 6px;
  padding: 18px 20px;
  box-shadow: 5px 5px 0 rgba(42,33,24,0.8);
  flex: 1; display: flex; flex-direction: column; min-height: 240px;
}
.history-panel h3 {
  font-family: 'Caveat', cursive; font-size: 1.4rem; font-weight: 700;
  color: #1e4a8c;
  border-bottom: 2px solid #1e4a8c;
  padding-bottom: 6px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.history-table-wrap { flex: 1; overflow-y: auto; padding-right: 4px; }
.history-table { width: 100%; border-collapse: collapse; font-size: 1rem; font-family: 'Kalam', cursive; }
.history-table th {
  text-align: left; padding: 7px 10px; color: #6e5c44; font-weight: 700;
  position: sticky; top: 0; background: #fffdf5; z-index: 2;
}
.history-table td { padding: 9px 10px; border-bottom: 1px dashed #ded0b1; vertical-align: middle; }
.badge {
  padding: 3px 10px; border-radius: 4px; font-weight: 700;
  font-size: 0.9rem; display: inline-block; border: 1.5px solid transparent;
  letter-spacing: 0.03em;
}
.badge.x { background: rgba(184,40,30,0.1); color: #b8281e; border-color: #b8281e; }
.badge.t { background: rgba(30,74,140,0.1);  color: #1e4a8c;  border-color: #1e4a8c; }
.result-win  { color: #2e7a2e; font-weight: bold; font-family: 'Patrick Hand', cursive; font-size: 1.1rem; }
.result-lose { color: #b8281e; font-weight: bold; font-family: 'Patrick Hand', cursive; font-size: 1.1rem; }
.result-wait { color: #6e5c44; font-family: 'Patrick Hand', cursive; }
.result-win::before  { content: '✓ '; }
.result-lose::before { content: '✗ '; }

/* ── TOOL VIEW (WIDGET + IFRAME) ── */
#viewToolWidget {
  display: none; position: fixed; inset: 0;
  z-index: 50; background: #071019;
}
#viewToolWidget iframe.game-frame {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none; z-index: 0;
}
.tool-topbar {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: linear-gradient(180deg, rgba(7,16,25,0.92), rgba(7,16,25,0));
  z-index: 20; pointer-events: none;
}
.tool-topbar > * { pointer-events: auto; }
.tool-topbar .btn-back {
  background: #ffc4d4; border: 2px solid #2a2118; color: #2a2118;
  padding: 7px 14px; border-radius: 4px;
  font-family: 'Patrick Hand', cursive; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; box-shadow: 3px 3px 0 #2a2118; transition: 0.1s;
  display: flex; align-items: center; gap: 6px;
}
.tool-topbar .btn-back:active { transform: translate(3px,3px); box-shadow: 0 0 0 #2a2118; }
.tool-topbar .title {
  font-family: 'Caveat', cursive; font-size: 1.4rem; font-weight: 700;
  color: #ffd36b; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

/* ── WIDGET NHÁY ── */
.widget{
  width:190px;height:96px;
  background:linear-gradient(135deg,#1a2332,#0f1620);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  position:absolute;top:80px;left:20px;overflow:hidden;z-index:25;
  transform-origin:center center;
  backdrop-filter:blur(6px);
  touch-action: none;
}
.widget .content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.widget .rotate-btn{
  position:absolute;top:4px;right:4px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  color:#8899aa;font-size:14px;cursor:pointer;z-index:10;
  width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.widget .rotate-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.widget .row{display:flex;justify-content:space-between;align-items:center;width:92%;height:80%;margin-top:6px}
.widget .col{flex:1;display:flex;flex-direction:column;align-items:center}
.widget .predict-text{font-size:18px;font-weight:900;margin-bottom:5px;letter-spacing:0.5px}
.widget .tai .predict-text{color:#4ade80;text-shadow:0 0 8px rgba(74,222,128,0.3)}
.widget .xiu .predict-text{color:#f87171;text-shadow:0 0 8px rgba(248,113,113,0.3)}
.widget .circle{
  width:34px;height:34px;
  border:2px solid rgba(255,255,255,0.25);
  border-radius:50%;
  background:rgba(255,255,255,0.03);
  transition:all 0.2s;
}
.widget .center{
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  color:rgba(255,255,255,0.75);
  padding:3px 12px;
  border-radius:4px;
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  transform:skewX(-20deg);
  transition: all 0.3s ease;
  border:1px solid rgba(255,255,255,0.08);
  text-shadow:0 0 6px rgba(255,255,255,0.15);
}
.widget .center span{display:inline-block;transform:skewX(20deg)}
@keyframes blinkGreen{
  0%{background:transparent;box-shadow:none;border-color:rgba(255,255,255,0.25)}
  25%{background:lime;box-shadow:0 0 30px lime;border-color:lime}
  50%{background:transparent;box-shadow:none;border-color:rgba(255,255,255,0.25)}
  75%{background:lime;box-shadow:0 0 30px lime;border-color:lime}
  100%{background:transparent;box-shadow:none;border-color:rgba(255,255,255,0.25)}
}
@keyframes blinkRed{
  0%{background:transparent;box-shadow:none;border-color:rgba(255,255,255,0.25)}
  25%{background:red;box-shadow:0 0 30px red;border-color:red}
  50%{background:transparent;box-shadow:none;border-color:rgba(255,255,255,0.25)}
  75%{background:red;box-shadow:0 0 30px red;border-color:red}
  100%{background:transparent;box-shadow:none;border-color:rgba(255,255,255,0.25)}
}
.widget .blink-green{ animation: blinkGreen 0.15s infinite; animation-timing-function: step-end; }
.widget .blink-red{ animation: blinkRed 0.15s infinite; animation-timing-function: step-end; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #0c111c;
  border: 1px solid rgba(120,180,255,.35);
  color: #e8eefc;
  padding: 13px 24px;
  border-radius: 60px; font-weight: 500; font-size: .88rem;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 20px 50px -10px rgba(0,0,0,.7);
  opacity: 0; transition: .45s cubic-bezier(.34,1.56,.64,1);
  z-index: 999; pointer-events: none; max-width: 90vw;
  font-family: 'Patrick Hand', cursive;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast i { font-size: 1.1rem; color: #22c55e; }

/* ── DEVTOOLS WARNING ── */
#devWarn {
  display: none; position: fixed; inset: 0;
  background: rgba(12,17,28,0.97); color: #e8eefc;
  z-index: 99999; padding: 40px 24px;
  font-family: 'Patrick Hand', cursive; text-align: center;
  align-items: center; justify-content: center; flex-direction: column; gap: 20px;
}
#devWarn.show { display: flex; }
#devWarn h2 { font-size: 2rem; color: #ef4444; }
#devWarn p { font-size: 1.1rem; max-width: 480px; line-height: 1.6; }
#devWarn button {
  margin-top: 16px; padding: 12px 28px;
  background: #22c55e; border: 2px solid #fff; color: #0c111c;
  border-radius: 6px; font-family: 'Patrick Hand', cursive;
  font-size: 1rem; font-weight: 700; cursor: pointer;
}
</style>
</head>
<body>

<div id="devWarn">
  <h2>⚠️ PHÁT HIỆN CAN THIỆP</h2>
  <p>Bạn đang mở DevTools hoặc chỉnh sửa mã nguồn.<br>Vui lòng đóng DevTools và tải lại trang để tiếp tục sử dụng.</p>
  <button onclick="location.reload()">Tải lại trang</button>
</div>

<div id="viewKho">
  <div class="kho-header">
    <div class="logo">🦁 KAIRO TOOL</div>
    <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
  </div>
  <div class="game-grid" id="gameGrid"></div>
</div>

<!-- TOOL CIRCLE (game thường) -->
<div id="viewToolCircle">
  <div class="tool-header">
    <button class="btn-back" onclick="backToKho()"><i class="fas fa-arrow-left"></i> Trở về</button>
    <div class="title" id="toolTitleCircle">GAME</div>
    <div style="width:80px;"></div>
  </div>
  <div class="tool-main">
    <div class="circle-wrap" id="circleWrap">
      <svg class="circle-svg" viewBox="0 0 260 260">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#b8281e"/>
            <stop offset="50%"  stop-color="#8e3dab"/>
            <stop offset="100%" stop-color="#1e4a8c"/>
          </linearGradient>
          <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#ff5c52"/>
            <stop offset="100%" stop-color="#5b8fff"/>
          </linearGradient>
        </defs>
        <circle class="track"    cx="130" cy="130" r="120"></circle>
        <circle class="bg"       cx="130" cy="130" r="120"></circle>
        <circle class="progress-glow" id="toolCircleGlow" cx="130" cy="130" r="120"></circle>
        <circle class="progress" id="toolCircle"    cx="130" cy="130" r="120"></circle>
      </svg>
      <div class="circle-text">
        <div class="pred-text" id="toolPredText">--</div>
        <div class="rate-text" id="toolRateText">--%</div>
      </div>
      <div class="conf-label">ĐỘ TIN CẬY</div>
    </div>
    <div class="history-panel">
      <h3><i class="fas fa-history"></i> Lịch sử &amp; Dự đoán</h3>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead><tr><th>Phiên</th><th>Dự đoán</th><th>Kết quả</th><th>Đánh giá</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- TOOL WIDGET (LC79, BETVIP) -->
<div id="viewToolWidget">
  <iframe class="game-frame" id="gameFrame" src="about:blank" allowfullscreen></iframe>
  <div class="tool-topbar">
    <button class="btn-back" onclick="backToKho()"><i class="fas fa-arrow-left"></i> Trở về</button>
    <div class="title" id="toolTitleWidget">GAME</div>
  </div>
  <div class="widget" id="widget" data-rot="0">
    <button class="rotate-btn" id="btnRotate">⟳</button>
    <div class="content">
      <div class="row">
        <div class="col tai">
          <div class="predict-text">TÀI</div>
          <div id="leftVal" class="circle"></div>
        </div>
        <div class="center" id="toolText"><span>TOOL</span></div>
        <div class="col xiu">
          <div class="predict-text">XỈU</div>
          <div id="rightVal" class="circle"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-circle-check"></i><span id="toastText"></span></div>

<script>
// ============================================================
// 🔒 ANTI-CRACK — FIX: chỉ hiện khi THỰC SỰ mở DevTools
// ============================================================
(function antiCrack() {
  'use strict';
  document.addEventListener('contextmenu', e => e.preventDefault(), false);
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (e.key === 'F12') { e.preventDefault(); return false; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c','k','e'].includes(k)) { e.preventDefault(); return false; }
    if ((e.ctrlKey || e.metaKey) && k === 'u') { e.preventDefault(); return false; }
    if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); return false; }
  }, false);

  let devWarned = false;
  const showWarn = () => {
    if (devWarned) return;
    devWarned = true;
    const warn = document.getElementById('devWarn');
    if (warn) warn.classList.add('show');
    document.body.style.overflow = 'hidden';
  };

  setInterval(() => {
    const t0 = performance.now();
    // eslint-disable-next-line no-debugger
    debugger;
    const dt = performance.now() - t0;
    if (dt > 120) showWarn();
  }, 1500);

  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (!isMobile) {
    setInterval(() => {
      const wDiff = window.outerWidth  - window.innerWidth;
      const hDiff = window.outerHeight - window.innerHeight;
      if (wDiff > 200 || hDiff > 200) showWarn();
    }, 1200);
  }
})();

const $ = id => document.getElementById(id);

function toast(msg, type='ok') {
  const t = $('toast'); $('toastText').textContent = msg;
  const ic = t.querySelector('i');
  ic.className = type==='ok' ? 'fas fa-circle-check' : 'fas fa-circle-exclamation';
  t.classList.add('show'); clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3200);
}

document.body.style.display = 'none';

function getDeviceId() {
  let devId = localStorage.getItem('kairo_device_id');
  if (!devId) {
    devId = 'web_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    localStorage.setItem('kairo_device_id', devId);
  }
  return devId;
}

function logout() {
  localStorage.removeItem('kairo_key');
  window.location.href = '/index.html';
}

async function authFetch(url, opts = {}) {
  const key = localStorage.getItem('kairo_key');
  if (!key) { logout(); throw new Error('NO_KEY'); }
  const deviceId = getDeviceId();
  const headers = Object.assign({}, opts.headers, {
    'x-kairo-key': key,
    'x-device-id': deviceId
  });
  const r = await fetch(url, Object.assign({}, opts, { headers }));
  if (r.status === 401 || r.status === 403) {
    localStorage.removeItem('kairo_key');
    alert('Phiên đăng nhập hết hạn hoặc đã được sử dụng trên thiết bị khác!');
    logout();
    throw new Error('UNAUTHORIZED');
  }
  return r;
}

function normalizePred(p) {
  if (!p) return '';
  const s = String(p).trim().toUpperCase();
  if (s === 'TÀI' || s === 'TAI' || s === 'BIG' || s === 'T') return 'TÀI';
  if (s === 'XỈU' || s === 'XIU' || s === 'SMALL' || s === 'X') return 'XỈU';
  return s;
}

let CONFIG_GAMES = [];
let currentGame  = null;
let currentToken = null;

// === STATE CHO TOOL CIRCLE ===
let circleTimer  = null;
let circleSpinning = false;
let circleLastPhien = null;
let circleRetry = 0;
const REFRESH_MS = 6000;

// === STATE CHO TOOL WIDGET ===
let widgetTimer = null;
let widgetLastPhien = 0;
let widgetCycleRunning = false;
let widgetCountdown = null;

async function loadGames() {
  try {
    const r = await authFetch('/api/games');
    const data = await r.json();
    CONFIG_GAMES = data.games || [];
    renderGames();
  } catch(e) { console.error(e); }
}

function renderGames() {
  const grid = $('gameGrid');
  grid.innerHTML = '';
  CONFIG_GAMES.forEach(g => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.onclick = () => openGame(g);
    let badgeHtml = '';
    if (g.badge === 'NEW') badgeHtml = '<div class="badge-new">NEW</div>';
    else if (g.badge === 'PRO') badgeHtml = '<div class="badge-new badge-pro">PRO</div>';
    card.innerHTML = `
      ${badgeHtml}
      <div class="game-logo"><i class="fas ${g.icon || 'fa-gamepad'}"></i></div>
      <div class="game-name">${g.name}</div>
      <div class="game-tagline">${g.tagline || 'Dự đoán chính xác cao'}</div>
      <button class="btn-play"><i class="fas fa-play"></i> BẮT ĐẦU</button>
    `;
    grid.appendChild(card);
  });
}

function openGame(g) {
  currentGame  = g;
  currentToken = g.token;
  
  // ÉP BUỘC MODE WIDGET CHO LC79 VÀ BETVIP DÙ API TRẢ VỀ GÌ
  let mode = g.mode || 'circle';
  const t = (g.token || '').toLowerCase();
  const n = (g.name || '').toLowerCase();
  
  if (t.includes('lc79') || n.includes('lc79') || t.includes('betvip') || n.includes('betvip')) {
    mode = 'widget';
  }

  if (mode === 'widget') {
    // Gán cứng link nếu API không trả về url
    let gameUrl = g.url;
    if (!gameUrl) {
      if (t.includes('lc79') || n.includes('lc79')) gameUrl = 'https://play.lc79.bet';
      else if (t.includes('betvip') || n.includes('betvip')) gameUrl = 'https://play.betvip01.hair';
    }
    openToolWidget(g, gameUrl);
  } else {
    openToolCircle(g);
  }
}

// ============================================================
// TOOL CIRCLE (game thường)
// ============================================================
function openToolCircle(g) {
  circleLastPhien = null; circleSpinning = false; circleRetry = 0;
  $('toolTitleCircle').textContent = g.name;
  $('toolPredText').textContent = '--';
  $('toolPredText').className   = 'pred-text';
  $('toolRateText').textContent = '--%';
  $('toolCircle').style.strokeDashoffset = 785;
  $('toolCircleGlow').style.strokeDashoffset = 785;
  $('circleWrap').classList.remove('spinning');
  $('historyBody').innerHTML = '';
  $('viewKho').style.display = 'none';
  $('viewToolWidget').style.display = 'none';
  $('viewToolCircle').style.display = 'flex';
  clearInterval(circleTimer);
  fetchPredictionCircle();
  circleTimer = setInterval(fetchPredictionCircle, REFRESH_MS);
}

async function fetchPredictionCircle() {
  if (circleSpinning) return;
  try {
    const r = await authFetch('/api/predict/' + encodeURIComponent(currentToken) + '?v=' + Date.now());
    let d = await r.json();
    circleRetry = 0;
    if (circleLastPhien !== null && d.phien !== circleLastPhien) {
      circleSpinning = true;
      startCircleSpin();
      setTimeout(() => { circleSpinning = false; renderCircle(d); }, 2000);
    } else {
      renderCircle(d);
    }
    circleLastPhien = d.phien;
  } catch(e) {
    if (circleRetry < 3) { circleRetry++; setTimeout(fetchPredictionCircle, 3000); return; }
    $('toolPredText').textContent = 'LỖI';
    $('toolRateText').textContent = 'OFFLINE';
    clearInterval(circleTimer);
  }
}

function startCircleSpin() {
  $('circleWrap').classList.add('spinning');
  $('toolPredText').textContent = '...';
  $('toolRateText').textContent = 'Đang phân tích...';
}

function renderCircle(d) {
  const predText = $('toolPredText');
  const rateText = $('toolRateText');
  const circle   = $('toolCircle');
  const glow     = $('toolCircleGlow');
  $('circleWrap').classList.remove('spinning');
  const pred = normalizePred(d.du_doan) || '--';
  const conf = d.tin_cay || 0;
  predText.textContent = pred;
  predText.className   = 'pred-text pop ' + (pred === 'TÀI' ? 'tai' : '');
  rateText.textContent = conf + '%';
  const offset = 785 - (785 * Math.min(conf, 100) / 100);
  circle.style.strokeDashoffset = offset;
  glow.style.strokeDashoffset   = offset;
  if (d.history && Array.isArray(d.history)) {
    const historyBody = $('historyBody');
    historyBody.innerHTML = '';
    d.history.forEach(item => {
      const tr = document.createElement('tr');
      const normPred = normalizePred(item.du_doan);
      const badgeCls = normPred === 'TÀI' ? 'badge t' : 'badge x';
      let resultHtml = `<span class="result-wait">...</span>`;
      let evalHtml   = `<span class="result-wait">...</span>`;
      if (item.ket_qua) {
        const normKet = normalizePred(item.ket_qua);
        const actualCls = normKet === 'TÀI' ? 'badge t' : 'badge x';
        resultHtml = `<span class="${actualCls}">${normKet}</span>`;
        evalHtml   = item.danh_gia === 'WIN' ? `<span class="result-win">WIN</span>` : `<span class="result-lose">LOSE</span>`;
      }
      tr.innerHTML = `
        <td>#${item.phien || '-'}</td>
        <td><span class="${badgeCls}">${normPred}</span></td>
        <td>${resultHtml}</td>
        <td>${evalHtml}</td>
      `;
      historyBody.appendChild(tr);
    });
  }
}

// ============================================================
// TOOL WIDGET (LC79, BETVIP)
// ============================================================
function openToolWidget(g, gameUrl) {
  widgetLastPhien = 0; widgetCycleRunning = false;
  resetWidgetBlink();
  $('toolTitleWidget').textContent = g.name;
  $('gameFrame').src = gameUrl || 'about:blank';
  $('viewKho').style.display = 'none';
  $('viewToolCircle').style.display = 'none';
  $('viewToolWidget').style.display = 'block';
  clearInterval(widgetTimer);
  fetchPredictionWidget();
  widgetTimer = setInterval(fetchPredictionWidget, REFRESH_MS);
}

async function fetchPredictionWidget() {
  try {
    const r = await authFetch('/api/predict/' + encodeURIComponent(currentToken) + '?v=' + Date.now());
    let d = await r.json();
    const phien = d.phien;
    const pred  = normalizePred(d.du_doan);
    if (phien && phien !== widgetLastPhien && pred && !widgetCycleRunning) {
      widgetLastPhien = phien;
      widgetCycleRunning = true;
      resetWidgetBlink();
      if (widgetCountdown) clearInterval(widgetCountdown);
      startWidgetCountdown(15, pred);
    }
  } catch(e) { /* silent */ }
}

function resetWidgetBlink() {
  ['leftVal','rightVal'].forEach(id => {
    const el = $(id);
    if (el) el.classList.remove('blink-green','blink-red');
  });
}

function startWidgetBlink(pred) {
  resetWidgetBlink();
  if (pred === 'TÀI') $('leftVal').classList.add('blink-green');
  else if (pred === 'XỈU') $('rightVal').classList.add('blink-red');
}

function startWidgetCountdown(seconds, pred) {
  let remain = seconds;
  if (widgetCountdown) clearInterval(widgetCountdown);
  widgetCountdown = setInterval(() => {
    remain--;
    if (remain <= 0) {
      clearInterval(widgetCountdown);
      widgetCountdown = null;
      startWidgetBlink(pred);
      setTimeout(() => {
        resetWidgetBlink();
        widgetCycleRunning = false;
      }, 10000);
    }
  }, 1000);
}

// ============================================================
// ĐIỀU HƯỚNG
// ============================================================
function backToKho() {
  clearInterval(circleTimer); circleTimer = null;
  clearInterval(widgetTimer); widgetTimer = null;
  if (widgetCountdown) { clearInterval(widgetCountdown); widgetCountdown = null; }
  resetWidgetBlink();
  widgetCycleRunning = false;
  circleRetry = 0;
  $('gameFrame').src = 'about:blank';
  $('viewToolCircle').style.display = 'none';
  $('viewToolWidget').style.display = 'none';
  $('viewKho').style.display = 'flex';
  document.body.style.overflow = '';
}

// ============================================================
// KÉO THẢ + XOAY WIDGET
// ============================================================
const widget = $('widget');
const btnRotate = $('btnRotate');
btnRotate.addEventListener('click', (e) => {
  e.stopPropagation();
  let rot = parseInt(widget.dataset.rot || 0) + 90;
  widget.dataset.rot = rot;
  widget.style.transform = `rotate(${rot}deg)`;
});

(function makeDraggable(el) {
  let dragging = false, offX = 0, offY = 0;
  const start = (x, y, e) => {
    if (e.target.closest('button')) return;
    dragging = true;
    offX = x - el.offsetLeft;
    offY = y - el.offsetTop;
  };
  el.addEventListener('mousedown', (e) => start(e.clientX, e.clientY, e));
  el.addEventListener('touchstart', (e) => start(e.touches[0].clientX, e.touches[0].clientY, e), {passive:true});
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    el.style.left = (e.clientX - offX) + 'px';
    el.style.top  = (e.clientY - offY) + 'px';
  });
  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    el.style.left = (e.touches[0].clientX - offX) + 'px';
    el.style.top  = (e.touches[0].clientY - offY) + 'px';
  }, {passive:true});
  document.addEventListener('mouseup', () => { dragging = false; });
  document.addEventListener('touchend', () => { dragging = false; });
})(widget);

// ============================================================
// KHỞI ĐỘNG
// ============================================================
window.addEventListener('load', async () => {
  const key = localStorage.getItem('kairo_key');
  if (!key) return logout();
  try {
    const deviceId = getDeviceId();
    const r = await fetch('/api/key/verify', {
      headers: { 'x-kairo-key': key, 'x-device-id': deviceId }
    });
    if (!r.ok) return logout();
    const d = await r.json();
    if (!d || !d.ok) return logout();
    document.body.style.display = 'flex';
    loadGames();
  } catch(e) { logout(); }
});
