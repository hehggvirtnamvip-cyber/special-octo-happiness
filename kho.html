<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KAIRO TOOL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background-color: #f2ead8; background-image: linear-gradient(#ded0b1 1px, transparent 1px); background-size: 100% 28px; color: #2a2118; font-family: 'Kalam', cursive; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }

/* Header */
.kho-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; border-bottom: 2px dashed #c2b088; background: rgba(242,234,216,0.95); backdrop-filter: blur(5px); position: sticky; top: 0; z-index: 10; }
.kho-header .logo { font-family: 'Caveat', cursive; font-size: 1.6rem; font-weight: 700; color: #b8281e; display: flex; align-items: center; gap: 8px; }
.btn-logout, .btn-back { background: #ffc4d4; border: 2px solid #2a2118; color: #2a2118; padding: 8px 16px; border-radius: 4px; font-family: 'Patrick Hand', cursive; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 #2a2118; transition: 0.1s; display: flex; align-items: center; gap: 6px; }
.btn-logout:active, .btn-back:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #2a2118; }

/* View Kho */
#viewKho { flex: 1; display: flex; flex-direction: column; padding: 30px 20px; max-width: 1000px; margin: 0 auto; width: 100%; }
.game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
.game-card { background: #fff3a8; border: 2px solid #2a2118; border-radius: 2px; padding: 24px; text-align: center; position: relative; cursor: pointer; box-shadow: 4px 4px 0 rgba(42,33,24,0.8); transition: transform 0.2s; }
.game-card:nth-child(even) { background: #b8dcff; }
.game-card:nth-child(3n) { background: #c8eab0; }
.game-card::before { content: '📌'; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; }
.game-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(42,33,24,0.8); }
.game-logo { width: 70px; height: 70px; margin: 0 auto 16px; background: #fff; border: 2px solid #2a2118; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; color: #b8281e; box-shadow: 2px 2px 0 rgba(42,33,24,0.5); }
.game-name { font-family: 'Caveat', cursive; font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; color: #2a2118; }
.game-tagline { font-family: 'Kalam', cursive; font-size: 0.9rem; color: #6e5c44; margin-bottom: 20px; }
.btn-play { width: 100%; padding: 12px; border-radius: 4px; border: 2px solid #2a2118; background: #b8281e; color: #fff; font-family: 'Patrick Hand', cursive; font-weight: 700; font-size: 1.1rem; cursor: pointer; box-shadow: 3px 3px 0 #2a2118; transition: 0.1s; }
.btn-play:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2a2118; }

/* View Tool */
#viewTool { display: none; flex: 1; flex-direction: column; height: 100vh; }
.tool-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(242,234,216,0.95); border-bottom: 2px dashed #c2b088; }
.tool-header .title { font-family: 'Caveat', cursive; font-size: 1.6rem; font-weight: 700; color: #b8281e; }

.tool-main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
.circle-wrap { position: relative; width: 260px; height: 260px; display: grid; place-items: center; margin-bottom: 20px; flex-shrink: 0; }
.circle-svg { width: 100%; height: 100%; transform: rotate(-90deg); transition: transform 0.5s ease-in-out; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); }
.circle-svg circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.circle-svg .bg { stroke: rgba(0,0,0,0.1); }
.circle-svg .progress { stroke: url(#grad); stroke-dasharray: 785; stroke-dashoffset: 785; transition: stroke-dashoffset 1s ease-in-out; }
.circle-text { position: absolute; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.6); border-radius: 50%; box-shadow: inset 0 0 20px rgba(0,0,0,0.05); margin: 10px; width: calc(100% - 20px); height: calc(100% - 20px); }
.pred-text { font-family: 'Caveat', cursive; font-size: 4.5rem; font-weight: 700; color: #b8281e; line-height: 1; }
.pred-text.tai { color: #1e4a8c; }
.rate-text { font-size: 1.2rem; color: #453728; margin-top: 5px; font-weight: 700; font-family: 'Kalam', cursive; }

.history-panel { width: 100%; max-width: 600px; background: #fffdf5; border: 2px solid #2a2118; border-radius: 6px; padding: 20px; box-shadow: 4px 4px 0 rgba(42,33,24,0.8); flex: 1; display: flex; flex-direction: column; min-height: 250px; }
.history-panel h3 { font-family: 'Caveat', cursive; font-size: 1.4rem; font-weight: 700; color: #1e4a8c; border-bottom: 2px solid #1e4a8c; padding-bottom: 5px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.history-table-wrap { flex: 1; overflow-y: auto; padding-right: 5px; }
.history-table { width: 100%; border-collapse: collapse; font-size: 1rem; font-family: 'Kalam', cursive; }
.history-table th { text-align: left; padding: 8px 10px; color: #6e5c44; font-weight: 700; position: sticky; top: 0; background: #fffdf5; z-index: 2; }
.history-table td { padding: 10px; border-bottom: 1px dashed #ded0b1; }
.badge { padding: 2px 10px; border-radius: 4px; font-weight: 700; font-size: 0.9rem; display: inline-block; border: 1px solid transparent; }
.badge.x { background: rgba(184,40,30,0.1); color: #b8281e; border-color: #b8281e; }
.badge.t { background: rgba(30,74,140,0.1); color: #1e4a8c; border-color: #1e4a8c; }
.badge.wait { background: rgba(110,92,68,0.1); color: #6e5c44; border-color: #6e5c44; }
.result-win { color: #2e7a2e; font-weight: bold; font-family: 'Patrick Hand', cursive; font-size: 1.1rem; }
.result-lose { color: #b8281e; font-weight: bold; font-family: 'Patrick Hand', cursive; font-size: 1.1rem; }
.result-wait { color: #6e5c44; font-family: 'Patrick Hand', cursive; }
.history-table-wrap::-webkit-scrollbar { width: 8px; }
.history-table-wrap::-webkit-scrollbar-track { background: #f2ead8; border-radius: 4px; }
.history-table-wrap::-webkit-scrollbar-thumb { background: #c2b088; border-radius: 4px; border: 2px solid #f2ead8; }
.spinner { animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#0c111c;border:1px solid rgba(120,180,255,.35);color:#e8eefc;padding:14px 26px;border-radius:60px;font-weight:500;font-size:.9rem;display:flex;align-items:center;gap:10px;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);opacity:0;transition:.45s cubic-bezier(.34,1.56,.64,1);z-index:999;pointer-events:none;max-width:90vw;font-family:'Inter',sans-serif;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{font-size:1.15rem;color:#22c55e;}
</style>
</head>
<body>

<div id="viewKho">
  <div class="kho-header">
    <div class="logo">🦁 KAIRO TOOL</div>
    <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
  </div>
  <div style="padding: 30px 20px; max-width: 1000px; margin: 0 auto; width: 100%;">
    <div class="game-grid" id="gameGrid"></div>
  </div>
</div>

<div id="viewTool">
  <div class="tool-header">
    <button class="btn-back" onclick="backToKho()"><i class="fas fa-arrow-left"></i> Trở về</button>
    <div class="title" id="toolTitle">GAME</div>
    <div style="width: 80px;"></div>
  </div>
  
  <div class="tool-main">
    <div class="circle-wrap">
      <svg class="circle-svg" id="toolCircleSvg" viewBox="0 0 260 260">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#b8281e" />
            <stop offset="100%" stop-color="#1e4a8c" />
          </linearGradient>
        </defs>
        <circle class="bg" cx="130" cy="130" r="120"></circle>
        <circle class="progress" id="toolCircle" cx="130" cy="130" r="120"></circle>
      </svg>
      <div class="circle-text">
        <div class="pred-text" id="toolPredText">--</div>
        <div class="rate-text" id="toolRateText">--%</div>
      </div>
    </div>

    <div class="history-panel">
      <h3><i class="fas fa-history"></i> Lịch sử & Dự đoán</h3>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead><tr><th>Phiên</th><th>Dự đoán</th><th>Kết quả</th><th>Đánh giá</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-circle-check"></i><span id="toastText"></span></div>

<script>
const $ = id => document.getElementById(id);
function toast(msg, type='ok'){
  const t = $('toast'); $('toastText').textContent = msg;
  const ic = t.querySelector('i');
  ic.className = type==='ok' ? 'fas fa-circle-check' : 'fas fa-circle-exclamation';
  ic.style.color = type==='ok' ? '#22c55e' : '#ef4444';
  t.classList.add('show'); clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 3200);
}

if (!localStorage.getItem('kairo_key')) {
  window.location.href = '/index.html';
}

let CONFIG_GAMES = [];
let currentToken = null;
let predTimer = null;
let isSpinning = false;
let lastPhien = null;
let retryCount = 0; 
const REFRESH_MS = 6000; 

function logout() {
  localStorage.removeItem('kairo_key');
  window.location.href = '/index.html';
}

async function loadGames() {
  try {
    const r = await fetch('/api/games');
    const data = await r.json();
    CONFIG_GAMES = data.games;
    renderGames();
  } catch(e) { toast('Lỗi tải danh sách game', 'err'); }
}

function renderGames() {
  const grid = $('gameGrid');
  grid.innerHTML = '';
  CONFIG_GAMES.forEach(g => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.onclick = () => openTool(g.token, g.name);
    card.innerHTML = `
      <div class="game-logo"><i class="fas ${g.icon}"></i></div>
      <div class="game-name">${g.name}</div>
      <div class="game-tagline">${g.tagline}</div>
      <button class="btn-play"><i class="fas fa-play"></i> BẮT ĐẦU</button>
    `;
    grid.appendChild(card);
  });
}

function backToKho() {
  clearInterval(predTimer);
  retryCount = 0;
  $('viewTool').style.display = 'none';
  $('viewKho').style.display = 'flex';
}

function openTool(token, name) {
  currentToken = token;
  lastPhien = null;
  isSpinning = false;
  retryCount = 0;
  
  $('toolTitle').textContent = name;
  
  $('toolPredText').textContent = '--';
  $('toolPredText').className = 'pred-text';
  $('toolPredText').style.color = ''; 
  $('toolPredText').style.fontSize = '';
  $('toolRateText').textContent = '--%';
  $('toolRateText').style.color = '';
  $('toolCircle').style.strokeDashoffset = 785;
  $('toolCircleSvg').style.transform = 'rotate(-90deg)'; 
  $('historyBody').innerHTML = '';

  $('viewKho').style.display = 'none';
  $('viewTool').style.display = 'flex';
  
  startPrediction();
}

function startPrediction() {
  clearInterval(predTimer);
  fetchPrediction(true);
  predTimer = setInterval(() => fetchPrediction(false), REFRESH_MS);
}

async function fetchPrediction(isFirst) {
  if (isSpinning) return;
  try {
    const r = await fetch('/api/predict/' + encodeURIComponent(currentToken) + '?v=' + Date.now());
    
    let d;
    try {
      d = await r.json();
    } catch (err) {
      throw new Error("SERVER_DISCONNECTED");
    }
    
    if (d.error) throw new Error(d.error);
    
    retryCount = 0;

    if (lastPhien !== null && d.phien !== lastPhien) {
      isSpinning = true;
      startSpin();
      setTimeout(() => {
        isSpinning = false;
        renderTool(d);
      }, 10000);
    } else {
      renderTool(d);
    }
    lastPhien = d.phien;
  } catch(e) {
    console.log("Lỗi API:", e.message);
    
    if (retryCount < 5) { 
        retryCount++;
        $('toolPredText').textContent = 'ĐANG KẾT NỐI...';
        $('toolPredText').style.fontSize = '1.5rem';
        
        try {
            const rg = await fetch('/api/games');
            const dataG = await rg.json();
            if (dataG.games && dataG.games.length > 0) {
                const cfg = dataG.games.find(g => g.name === $('toolTitle').textContent);
                if (cfg) currentToken = cfg.token;
            }
        } catch (errG) {}
        
        setTimeout(() => fetchPrediction(false), 5000); 
        return;
    }

    $('toolPredText').textContent = 'LỖI';
    $('toolRateText').textContent = 'SERVER OFFLINE';
    $('toolPredText').className = 'pred-text';
    $('toolPredText').style.color = '#b8281e';
    $('toolPredText').style.fontSize = '2rem';
    $('toolRateText').style.color = '#b8281e';
    
    toast(e.message, 'err');
    clearInterval(predTimer);
  }
}

function startSpin() {
  const predText = $('toolPredText');
  const rateText = $('toolRateText');
  const circleSvg = $('toolCircleSvg');
  const circleBar = $('toolCircle');
  
  predText.textContent = '...';
  predText.className = 'pred-text spinner';
  rateText.textContent = 'ĐANG PHÂN TÍCH';
  
  circleBar.style.transition = 'none';
  circleBar.style.strokeDashoffset = 785; 
  
  let deg = 0;
  const spinInterval = setInterval(() => {
    if (!isSpinning) {
      clearInterval(spinInterval);
      predText.classList.remove('spinner');
      circleSvg.style.transform = 'rotate(-90deg)'; 
      return;
    }
    deg += 10;
    circleSvg.style.transform = `rotate(${deg}deg)`;
  }, 50);
}

function renderTool(d) {
  const predText = $('toolPredText');
  const rateText = $('toolRateText');
  const circle = $('toolCircle');
  const historyBody = $('historyBody');

  let pred = d.du_doan || '--';
  let conf = d.tin_cay || 0;

  predText.style.color = '';
  predText.style.fontSize = '';

  circle.style.transition = 'stroke-dashoffset 1s ease-in-out';
  predText.textContent = pred;
  predText.className = 'pred-text ' + (pred === 'TÀI' || pred === 'BIG' ? 'tai' : '');
  rateText.textContent = conf + '%';
  
  const offset = 785 - (785 * Math.min(conf, 100) / 100);
  circle.style.strokeDashoffset = offset;

  if (d.history && Array.isArray(d.history)) {
    historyBody.innerHTML = '';
    d.history.forEach(item => {
      const tr = document.createElement('tr');
      
      let badgeCls = (item.du_doan === 'TÀI' || item.du_doan === 'BIG') ? 'badge t' : 'badge x';
      let resultHtml = `<span class="result-wait">...</span>`;
      let evalHtml = `<span class="result-wait">...</span>`;

      if (item.ket_qua) {
        let actualCls = (item.ket_qua === 'TÀI' || item.ket_qua === 'BIG') ? 'badge t' : 'badge x';
        resultHtml = `<span class="${actualCls}">${item.ket_qua}</span>`;
        evalHtml = item.danh_gia === 'WIN' ? `<span class="result-win">WIN</span>` : `<span class="result-lose">LOSE</span>`;
      }

      tr.innerHTML = `
        <td>#${item.phien}</td>
        <td><span class="${badgeCls}">${item.du_doan}</span></td>
        <td>${resultHtml}</td>
        <td>${evalHtml}</td>
      `;
      historyBody.appendChild(tr);
    });
  }
}

window.addEventListener('load', () => {
  if (localStorage.getItem('kairo_key')) loadGames();
});
</script>
</body>
</html>
